[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "0.2.0.dev0"
description = "Local-first AI CLI that diagnoses build and runtime errors from your logs, with cited evidence"
readme = "README.md"
authors = [
    {name = "Kiran Vijaykumar Choudhari", email = "choudharikiranv2003@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
]
keywords = [
    "ai",
    "llm",
    "ollama",
    "devops",
    "sre",
    "debugging",
    "incident-analysis",
    "root-cause-analysis",
    "cli",
]

dependencies = [
    "typer>=0.12.0,<1.0",
    "rich>=13.7.0,<15.0",
    "requests>=2.31.0,<3.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.6.0",
    "mypy>=1.9.0",
    "hypothesis>=6.98.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/choudharikiranv15/OpsPilot-AI"
Documentation = "https://github.com/choudharikiranv15/OpsPilot-AI#readme"
Repository = "https://github.com/choudharikiranv15/OpsPilot-AI"
"Bug Tracker" = "https://github.com/choudharikiranv15/OpsPilot-AI/issues"
Changelog = "https://github.com/choudharikiranv15/OpsPilot-AI/releases"

[project.scripts]
opspilot = "opspilot.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["opspilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 60

[tool.coverage.run]
source = ["opspilot"]
omit = ["tests/*", "opspilot/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]  # nested patch() context managers read better in tests
"opspilot/cli.py" = ["B008"]  # typer.Option(...) defaults are the Typer idiom

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable
check_untyped_defs = true
no_implicit_optional = true
